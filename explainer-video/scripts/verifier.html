<!doctype html>
<html><head><meta charset="utf-8"><title>verification</title></head>
<body style="margin:0;background:#141418;color:#ddd;font:600 14px sans-serif">
<div id="g" style="display:grid;grid-template-columns:repeat(3,416px);gap:8px;padding:8px"></div>
<script>
const W = 1920, H = 1080;
const charger = async (url) => createImageBitmap(await (await fetch(url)).blob(), { colorSpaceConversion: 'none' });
const pixels = (src) => {
  const c = new OffscreenCanvas(W, H), x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(src, 0, 0, W, H);
  return { canvas: c, data: x.getImageData(0, 0, W, H).data };
};
const imageAffichee = (v) => new Promise(ok => {
  let fini = false; const fin = () => { if (!fini) { fini = true; ok(); } };
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => fin());
  setTimeout(fin, 1500);
});
function mesures(a, b) {
  let somme = 0, lum = 0, lum2 = 0, nb = 0;
  for (let i = 0; i < a.length; i += 16) {
    somme += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
    const y = .2126 * b[i] + .7152 * b[i + 1] + .0722 * b[i + 2];
    lum += y; lum2 += y * y; nb++;
  }
  const m = lum / nb;
  return { ecartMoyen: +(somme / nb / 3).toFixed(2), luminance: +m.toFixed(1), contraste: +Math.sqrt(Math.max(0, lum2 / nb - m * m)).toFixed(1) };
}
const POINTS = [[40, 1060], [960, 540], [640, 360]];
const ecartPoints = (a, b) => Math.max(...POINTS.flatMap(([x, y]) => { const k = (y * W + x) * 4; return [0, 1, 2].map(c => Math.abs(a[k + c] - b[k + c])); }));

async function verifier({ paires, video, fps }) {
  try {
    let v = null;
    const res = { points: [] };
    if (video) {
      const blob = await (await fetch(video)).blob();
      v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
      v.src = URL.createObjectURL(blob);
      await new Promise((ok, ko) => { v.oncanplaythrough = ok; v.onerror = () => ko(new Error('le navigateur ne lit pas ce MP4')); });
      Object.assign(res, { duree: +v.duration.toFixed(3), largeur: v.videoWidth, hauteur: v.videoHeight });
    }
    let precedente = null, toutesDifferentes = true;
    for (const [n, q] of paires.entries()) {
      const ref = pixels(await charger(q.ref));
      let dec;
      if (v) {
        const vu = imageAffichee(v);
        v.currentTime = (q.i + 0.5) / fps;
        await new Promise(ok => { v.onseeked = ok; });
        await vu;
        dec = pixels(v);
      } else dec = pixels(await charger(q.dec));
      const m = mesures(ref.data, dec.data);
      const noire = m.contraste < 2;
      if (precedente && mesures(precedente, dec.data).ecartMoyen < 0.5) toutesDifferentes = false;
      precedente = dec.data;
      res.points.push({ t: q.t, ...m, ecartMax: ecartPoints(ref.data, dec.data), noire });
      if (n === Math.floor(paires.length / 2)) {
        const png = await dec.canvas.convertToBlob({ type: 'image/png' });
        await fetch('/save?f=image-decodee-' + String(q.t).replace('.', 's') + '.png', { method: 'POST', body: png });
      }
      const c = document.createElement('canvas'); c.width = 416; c.height = 234;
      c.getContext('2d').drawImage(dec.canvas, 0, 0, 416, 234);
      const d = document.createElement('div'); d.appendChild(c);
      d.insertAdjacentHTML('beforeend', `<div style="padding:3px">${q.t.toFixed(2)} s, écart moyen ${m.ecartMoyen}${noire ? ', NOIRE' : ''}</div>`);
      document.getElementById('g').appendChild(d);
    }
    res.toutesDifferentes = toutesDifferentes;
    return res;
  } catch (e) { return { erreur: e.message }; }
}
</script></body></html>

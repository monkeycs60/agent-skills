<!doctype html>
<html><head><meta charset="utf-8"><title>verification</title></head>
<body style="margin:0;background:#141418;color:#ddd;font:600 14px sans-serif">
<div id="g" style="display:grid;grid-template-columns:repeat(3,416px);gap:8px;padding:8px"></div>
<script>
const W = 1920, H = 1080;
const load = async (url) => createImageBitmap(await (await fetch(url)).blob(), { colorSpaceConversion: 'none' });
const pixels = (src) => {
  const c = new OffscreenCanvas(W, H), x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(src, 0, 0, W, H);
  return { canvas: c, data: x.getImageData(0, 0, W, H).data };
};
const frameShown = (v) => new Promise(ok => {
  let done = false; const end = () => { if (!done) { done = true; ok(); } };
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => end());
  setTimeout(end, 1500);
});
function measures(a, b) {
  let sum = 0, lum = 0, lum2 = 0, nb = 0;
  for (let i = 0; i < a.length; i += 16) {
    sum += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
    const y = .2126 * b[i] + .7152 * b[i + 1] + .0722 * b[i + 2];
    lum += y; lum2 += y * y; nb++;
  }
  const m = lum / nb;
  return { meanDiff: +(sum / nb / 3).toFixed(2), luminance: +m.toFixed(1), contrast: +Math.sqrt(Math.max(0, lum2 / nb - m * m)).toFixed(1) };
}
const POINTS = [[40, 1060], [960, 540], [640, 360]];
const pointDiff = (a, b) => Math.max(...POINTS.flatMap(([x, y]) => { const k = (y * W + x) * 4; return [0, 1, 2].map(c => Math.abs(a[k + c] - b[k + c])); }));

async function verify({ pairs, video, fps }) {
  try {
    let v = null;
    const res = { points: [] };
    if (video) {
      const blob = await (await fetch(video)).blob();
      v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
      v.src = URL.createObjectURL(blob);
      await new Promise((ok, ko) => { v.oncanplaythrough = ok; v.onerror = () => ko(new Error('the browser cannot play this MP4')); });
      Object.assign(res, { duration: +v.duration.toFixed(3), width: v.videoWidth, height: v.videoHeight });
    }
    let previous = null, allDifferent = true;
    for (const [n, q] of pairs.entries()) {
      const ref = pixels(await load(q.ref));
      let dec;
      if (v) {
        const shown = frameShown(v);
        v.currentTime = (q.i + 0.5) / fps;
        await new Promise(ok => { v.onseeked = ok; });
        await shown;
        dec = pixels(v);
      } else dec = pixels(await load(q.dec));
      const m = measures(ref.data, dec.data);
      const black = m.contrast < 2;
      if (previous && measures(previous, dec.data).meanDiff < 0.5) allDifferent = false;
      previous = dec.data;
      res.points.push({ t: q.t, ...m, maxDiff: pointDiff(ref.data, dec.data), black });
      if (n === Math.floor(pairs.length / 2)) {
        const png = await dec.canvas.convertToBlob({ type: 'image/png' });
        await fetch('/save?f=decoded-frame-' + String(q.t).replace('.', 's') + '.png', { method: 'POST', body: png });
      }
      const c = document.createElement('canvas'); c.width = 416; c.height = 234;
      c.getContext('2d').drawImage(dec.canvas, 0, 0, 416, 234);
      const d = document.createElement('div'); d.appendChild(c);
      d.insertAdjacentHTML('beforeend', `<div style="padding:3px">${q.t.toFixed(2)} s, mean difference ${m.meanDiff}${black ? ', BLACK' : ''}</div>`);
      document.getElementById('g').appendChild(d);
    }
    res.allDifferent = allDifferent;
    return res;
  } catch (e) { return { error: e.message }; }
}
</script></body></html>

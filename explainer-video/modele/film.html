#tc { width: 110px; text-align: right; font-variant-numeric: tabular-nums; }

  put($('ring2'), { o: r2 * (.75 + .25 * Math.sin(tReel * 7)), s: .8 + .2 * clamp(sp(t, 22.35, 'play')) });

  const sh = $('shape');
  const gx = geo(t, 'x'), gy = geo(t, 'y'), gw = geo(t, 'w'), gh = geo(t, 'h'), gr = geo(t, 'r');
  const pulse = 1 + imp(t, 6.9, -.035) + imp(t, 15.85, .03) + imp(t, 19.6, -.05);
  sh.style.transform = `translate(${gx.toFixed(2)}px,${gy.toFixed(2)}px) scale(${pulse.toFixed(4)})`;
  sh.style.transformOrigin = `${(gw / 2).toFixed(1)}px ${(gh / 2).toFixed(1)}px`;
  sh.style.width = Math.max(1, gw).toFixed(2) + 'px'; sh.style.height = Math.max(1, gh).toFixed(2) + 'px';
  sh.style.borderRadius = Math.max(0, gr).toFixed(2) + 'px';
  sh.style.backgroundColor = rgba(trA(t, VIO, BG_KEYS));
  const bw = Math.max(0, tr(t, 0, [[8.45,2,'ui'],[12.35,0,'ui'],[21.75,5,'ui'],[23.55,0,'ui']]));
  sh.style.borderWidth = bw.toFixed(2) + 'px';
  sh.style.borderColor = rgba(trA(t, LINE, [[9.0,VIO,'snap']]));
  const glow = Math.max(0, tr(t, 0, [[9.0,7,'snap'],[12.35,0,'ui'],[21.95,5,'ui'],[23.55,0,'ui']])) + (t > 22 && t < 23.6 ? 3 * Math.sin(tReel * 5) : 0);
  const elev = Math.max(0, tr(t, 0, [[12.8,.12,'ui'],[17.45,.22,'ui'],[21.75,0,'ui']]));
  const grn = Math.max(0, tr(t, 0, [[2.9,.25,'ui'],[5.55,0,'ui']]));
  sh.style.boxShadow = `0 0 0 ${glow.toFixed(2)}px color-mix(in srgb, var(--brand) 14%, transparent), 0 18px 40px ${alpha(VIO, elev)}, 0 10px 24px ${alpha(SUC, grn)}`;
  $('sheen').style.opacity = clamp(tr(t, 1, [[2.5,0,'ui'],[23.55,1,'def']])).toFixed(3);

  const cc = io(t, 2.82, 5.5, 'ui', 'snap');
  put($('cChip'), { o: cc });
  $('cChip').style.transform = `translate(-50%,-50%) scale(${(.8 + .2 * clamp(sp(t, 2.82, 'play'))).toFixed(4)})`;
  put($('cMenu'), { o: io(t, 6.18, 8.42, 'ui', 'snap') });
  $('cMenu').style.color = rgba(trA(t, INK, [[6.9,VIO,'snap']]));
  $('cMenu').style.fontWeight = t > 6.9 ? 600 : 500;
  put($('cInput'), { o: t < 12.35 ? io(t, 8.85, 99) : 0 });
  const wipe = clamp(sp(t, 9.5, 'snap'));
  $('urlTxt').style.clipPath = `inset(-10px ${(100 - 100 * wipe).toFixed(2)}% -10px -2px)`;
  $('urlTxt').style.transform = `translateX(${(-18 * (1 - wipe)).toFixed(2)}px)`;
  $('caret1').style.opacity = t > 9.0 && t < 12.35 && (Math.floor(tReel * 2.2) % 2 === 0 || (t > 9.4 && t < 9.9)) ? 1 : 0;
  put($('clearX'), { o: clamp(sp(t, 9.7, 'ui')) });
  put($('cGen'), { o: io(t, 12.62, 13.18, 'ui', 'snap') });
  $('shimmer').style.transform = `translateX(${(-420 + ((t - 12.6) * 1500) % 1700).toFixed(1)}px)`;

  put($('cLink'), { o: io(t, 13.12, 17.42, 'snap', 'snap') });
  const full = T.link.join(''), L0 = T.link[0].length, L1 = T.link[1].length;
  const pr = clamp((t - 13.15) / .9), n = Math.round(full.length * (1 - Math.pow(1 - pr, 2.2)));
  $('lPre').textContent = T.link[0].slice(0, n);
  $('lMid').textContent = T.link[1].slice(0, Math.max(0, n - L0));
  $('lPost').textContent = T.link[2].slice(0, Math.max(0, n - L0 - L1));
  $('caret2').style.opacity = t > 13.1 && t < 14.4 ? ((pr < 1 || Math.floor(tReel * 4) % 2 === 0) ? 1 : 0) : 0;
  const hl = io(t, 14.3, 17.05, 'ui', 'ui');
  const hlE = $('hl');
  hlE.style.left = (linkW.midL - 8) + 'px'; hlE.style.top = '-6px'; hlE.style.height = (linkW.h + 12) + 'px';
  hlE.style.width = ((linkW.midW + 16) * hl).toFixed(1) + 'px'; hlE.style.opacity = hl.toFixed(3);
  const ca = sp(t, 14.45, 'play'), cao = sp(t, 17.1, 'ui');
  const cl = $('call');
  cl.style.left = (linkW.midL + linkW.midW / 2 - 130) + 'px'; cl.style.width = '260px'; cl.style.top = (linkW.h + 8) + 'px';
  const cv = clamp(ca) * (1 - clamp(cao));
  cl.style.opacity = cv.toFixed(3); cl.style.visibility = cv > .001 ? 'visible' : 'hidden';
  $('callLine').style.strokeDashoffset = (44 * (1 - clamp(sp(t, 14.45, 'ui')))).toFixed(1);
  $('callTxt').style.transform = `scale(${(.6 + .4 * ca).toFixed(4)})`;
  put($('copyIco'), { o: clamp(sp(t, 13.9, 'ui')), s: .6 + .4 * sp(t, 13.9, 'play') });
  const ck = sp(t, 15.87, 'play');
  put($('icCopy'), { o: 1 - clamp(sp(t, 15.87, 'snap')), s: 1 - .4 * clamp(sp(t, 15.87, 'snap')) });
  put($('icCheck'), { o: clamp(ck), s: .3 + .7 * ck });

  put($('cBtn'), { o: io(t, 17.8, 21.4, 'ui', 'snap') });
  $('cBtn').style.transform = `translate(-50%,-50%) scale(${(.85 + .15 * clamp(sp(t, 17.8, 'play'))).toFixed(4)})`;

  const cu = $('cursor');
  const seg = CUR.find(c => t >= c.a - .01 && t <= c.b + .6);
  if (seg) {
    const cx = tr(t, seg.from[0], seg.mv.map(m => [m[0], m[1], m[3]]));
    const cy = tr(t, seg.from[1], seg.mv.map(m => [m[0], m[2], m[3]]));
    const pressC = seg.clicks.reduce((acc, c) => acc + imp(t, c, -.22, 12, 20), 0);
    const vis = clamp(sp(t, seg.a, 'ui')) * (1 - clamp(sp(t, seg.b, 'ui')));
    cu.style.transform = `translate(${(cx - 3).toFixed(2)}px,${(cy - 2).toFixed(2)}px) scale(${((1 + pressC) / camZ * 1.25).toFixed(4)})`;
    cu.style.transformOrigin = '3px 2px';
    cu.style.opacity = vis.toFixed(3); cu.style.visibility = vis > .001 ? 'visible' : 'hidden';
  } else { cu.style.opacity = 0; cu.style.visibility = 'hidden'; }
  const lastClick = CLICKS.filter(c => t >= c).pop();
  const rp = $('ripple');
  if (lastClick !== undefined && t - lastClick < .6 && seg) {
    const d = (t - lastClick) / .6, e = 1 - Math.pow(1 - d, 3);
    const cx = tr(lastClick, seg.from[0], seg.mv.map(m => [m[0], m[1], m[3]]));
    const cy = tr(lastClick, seg.from[1], seg.mv.map(m => [m[0], m[2], m[3]]));
    const R = 16 + 70 * e;
    rp.style.transform = `translate(${(cx - R).toFixed(2)}px,${(cy - R).toFixed(2)}px)`;
    rp.style.width = rp.style.height = (2 * R).toFixed(2) + 'px';
    rp.style.opacity = (.9 * (1 - d)).toFixed(3); rp.style.visibility = 'visible';
  } else { rp.style.opacity = 0; rp.style.visibility = 'hidden'; }

  const hk = $('hook');
  put($('over'), { o: io(t, .05, 2.3, 'ui', 'ui'), y: 16 * (1 - clamp(sp(t, .05))) });
  hookLines.forEach((l, i) => {
    const a = sp(t, .2 + i * .5, 'play'), b = sp(t, 2.28 + i * .06, 'ui');
    l.style.transform = `translateY(${(115 * (1 - a) - 115 * b).toFixed(2)}%) rotate(${(-4 * (1 - clamp(a))).toFixed(2)}deg)`;
    l.style.opacity = (1 - clamp(b * 1.6)).toFixed(3);
  });
  const mk = clamp(sp(t, 1.5, 'snap'));
  $('hMarkBg').style.transform = `scaleX(${mk.toFixed(4)})`;
  $('hWord').style.color = rgba(trA(t, WHT, [[1.55,INK,'snap']]));
  const gd = clamp(sp(t, .3, 'soft')), gd2 = clamp(sp(t, .55, 'soft'));
  $('gA').style.strokeDashoffset = (1 - gd).toFixed(4); $('gB').style.strokeDashoffset = (1 - gd2).toFixed(4);
  const gOut = sp(t, 2.3, 'ui');
  put($('glyph'), { o: io(t, .2, 2.3, 'ui', 'ui'), s: 1 + .06 * Math.sin(tReel * 2) - .6 * gOut, r: 10 * Math.sin(tReel * .9) + 90 * gOut });
  hk.style.visibility = t < 3.2 ? 'visible' : 'hidden';

  const CAPS = [[1, 2.85, 5.45], [2, 5.6, 8.35], [3, 8.55, 12.35], [4, 12.5, 17.3], [5, 17.5, 21.4], [6, 21.6, 23.45]];
  const SUBS = { 1: [[3.03, 4.1], [4.15, 99]], 3: [[8.7, 10.9], [10.95, 99]], 4: [[12.7, 15.75], [15.82, 99]] };
  CAPS.forEach(([k, a, b]) => {
    const c = $('cap' + k), out = sp(t, b, 'ui');
    const vis = t > a - .05 && t < b + .8;
    c.style.visibility = vis ? 'visible' : 'hidden';
    if (!vis) return;
    c.style.transform = `translateY(${(-36 * out).toFixed(2)}px)`;
    c.style.opacity = (1 - clamp(out)).toFixed(3);
    c.style.filter = out > .02 ? `blur(${(8 * clamp(out)).toFixed(2)}px)` : 'none';
    const bg = sp(t, a, 'play');
    c.querySelector('.badge').style.transform = `scale(${clamp(bg, 0, 2).toFixed(4)}) rotate(${(-40 * (1 - clamp(bg))).toFixed(2)}deg)`;
    capWords[k].forEach((w, i) => { w.style.transform = `translateY(${(112 * (1 - sp(t, a + .06 + i * .045, 'ui'))).toFixed(2)}%)`; });
    const subs = [...c.querySelectorAll('.sub > div')];
    const ranges = SUBS[k] || [[a + .18, 99]];
    subs.forEach((s, i) => {
      const [sa, sb] = ranges[i];
      const si = sp(t, sa, 'ui'), so2 = sp(t, sb, 'ui');
      s.style.opacity = (clamp(si) * (1 - clamp(so2))).toFixed(3);
      s.style.transform = `translateY(${(18 * (1 - si) - 18 * so2).toFixed(2)}px)`;
    });
  });

  const pv = io(t, 2.9, 23.45, 'ui', 'ui');
  $('prog').style.opacity = pv.toFixed(3);
  [...document.querySelectorAll('#prog i')].forEach((f, i) => {
    f.style.transform = `scaleX(${clamp(sp(t, CAPS[i][1] + .1, 'def')).toFixed(4)})`;
  });

  const ol = sp(t, 24.0, 'play');
  put($('oLogo'), { o: clamp(sp(t, 24.0, 'ui')), s: .7 + .3 * ol, y: 360 + 30 * (1 - ol) });
  put($('oTitle'), { o: clamp(sp(t, 24.22, 'ui')), y: 30 * (1 - sp(t, 24.22, 'def')), blur: 8 * (1 - clamp(sp(t, 24.22, 'ui'))) });
  const op = sp(t, 24.55, 'play');
  put($('oPill'), { o: clamp(op), s: .8 + .2 * op, y: 16 * (1 - op) });
  $('outro').style.visibility = t > 23.9 ? 'visible' : 'hidden';
}

function scene1(t, u) {
  const dans = t >= 2.4 && t <= INS_A + INS_D;
  put($('cApply'), { o: dans ? io(t, 2.82, 3.8, 'ui', 'snap') : 0 });
  put($('cPend'), { o: dans ? io(t, 3.9, 5.02, 'ui', 'snap') : 0, s: .8 + .2 * clamp(sp(t, 3.9, 'play'), 0, 1.3) });
  if (!dans) return;
  const sh = $('shape');
  sh.style.backgroundColor = rgba(trA(t, VIO, [[3.85, PEND, 'ui'], [5.05, GRN, 'ui']]));
  const pulse = 1 + imp(t, 3.75, -.05) + imp(t, 5.05, .06);
  sh.style.transform = `translate(${geo(u, 'x').toFixed(2)}px,${geo(u, 'y').toFixed(2)}px) scale(${pulse.toFixed(4)})`;
  const vio = .30 * (1 - clamp(sp(t, 3.85, 'ui'))), ora = .22 * io(t, 3.85, 5.05), gr = .25 * clamp(sp(t, 5.05, 'ui'));
  sh.style.boxShadow = `0 12px 30px ${alpha(VIO, vio)}, 0 10px 24px ${alpha(WARN, ora)}, 0 10px 24px ${alpha(SUC, gr)}`;
  $('sheen').style.opacity = clamp(tr(t, 1, [[2.5, .5, 'ui'], [3.85, 0, 'ui']])).toFixed(3);
  put($('cChip'), { o: clamp(sp(t, 5.1, 'ui')) });
  $('cChip').style.transform = `translate(-50%,-50%) scale(${(.8 + .2 * clamp(sp(t, 5.1, 'play'), 0, 1.3)).toFixed(4)})`;
  const subs = [...document.querySelectorAll('#cap1 .sub > div')];
  const a1 = sp(t, 3.03, 'ui'), b1 = sp(t, 4.45, 'ui'), a2 = sp(t, 4.52, 'ui');
  subs[0].style.opacity = (clamp(a1) * (1 - clamp(b1))).toFixed(3);
  subs[0].style.transform = `translateY(${(18 * (1 - a1) - 18 * b1).toFixed(2)}px)`;
  subs[1].style.opacity = clamp(a2).toFixed(3);
  subs[1].style.transform = `translateY(${(18 * (1 - a2)).toFixed(2)}px)`;
  const cu = $('cursor');
  if (t >= 2.99 && t <= 4.9) {
    const cx = tr(t, 1560, [[3.05, 1342, 'def']]), cy = tr(t, 1010, [[3.05, 592, 'def']]);
    const vis = clamp(sp(t, 3.0, 'ui')) * (1 - clamp(sp(t, 4.2, 'ui')));
    cu.style.transform = `translate(${(cx - 3).toFixed(2)}px,${(cy - 2).toFixed(2)}px) scale(${(1.25 * (1 + imp(t, 3.75, -.22, 12, 20))).toFixed(4)})`;
    cu.style.transformOrigin = '3px 2px';
    cu.style.opacity = vis.toFixed(3); cu.style.visibility = vis > .001 ? 'visible' : 'hidden';
  }
  const d = (t - 3.75) / .6, rp = $('ripple');
  if (d >= 0 && d < 1) {
    const e = 1 - Math.pow(1 - d, 3), R = 16 + 70 * e;
    rp.style.transform = `translate(${(1342 - R).toFixed(2)}px,${(592 - R).toFixed(2)}px)`;
    rp.style.width = rp.style.height = (2 * R).toFixed(2) + 'px';
    rp.style.opacity = (.9 * (1 - d)).toFixed(3); rp.style.visibility = 'visible';
  }
}

function paint(T) { const t = hold(T); const u = warp(t); paintBase(u, T); scene1(t, u); }

demarrer({ duree: DURATION, fps: FPS, init, peindre: paint, polices: policesCharte(), attendre: [CAPTURE] });
</script>

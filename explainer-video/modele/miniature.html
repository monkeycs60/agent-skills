<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Miniature YouTube</title>
<link rel="stylesheet" href="charte.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #111; }
#m { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--brand); font-family: var(--font-body); }
.a { position: absolute; left: 0; top: 0; }
.u { font-family: var(--font-title); }
</style>
</head>
<body>
<div id="m">
  <div class="a" style="width:1280px;height:720px;background:
    radial-gradient(70% 90% at 12% 0%, rgba(255,255,255,.26), rgba(255,255,255,0) 60%),
    radial-gradient(60% 70% at 100% 100%, color-mix(in srgb, var(--brand-deep) 55%, transparent), color-mix(in srgb, var(--brand-deep) 0%, transparent) 65%)"></div>
  <div class="a" style="left:700px;top:40px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--accent) 42%, transparent) 0%, transparent 62%)"></div>
  <div class="a" style="width:1280px;height:720px;opacity:.5;background-image:radial-gradient(circle, rgba(255,255,255,.22) 1.6px, transparent 2.3px);background-size:34px 34px;
    -webkit-mask-image:linear-gradient(90deg, rgba(0,0,0,.9), rgba(0,0,0,.2) 55%, rgba(0,0,0,0) 80%)"></div>

  <img class="a" data-logo="fonce" style="left:66px;top:54px;height:44px" alt="">

  <div class="a u" style="left:60px;top:150px;color:#fff;font-weight:900;font-size:128px;letter-spacing:-.05em;line-height:.93">
    <div data-k="l1"></div>
    <div data-k="l2"></div>
  </div>
  <div class="a u" style="left:66px;top:432px;transform:rotate(-2.5deg);transform-origin:0 50%;background:var(--accent);color:var(--ink);font-weight:900;font-size:66px;letter-spacing:-.035em;padding:4px 26px 10px;border-radius:20px;box-shadow:0 14px 30px color-mix(in srgb, var(--shadow) 35%, transparent)" data-k="promise"></div>

  <div class="a" style="left:858px;top:96px;width:352px;height:700px;transform:rotate(7deg);transform-origin:50% 0">
    <div class="a" style="width:352px;height:700px;border-radius:52px;background:#16161A;box-shadow:0 30px 70px color-mix(in srgb, var(--shadow) 55%, transparent)"></div>
    <div class="a" style="left:11px;top:11px;width:330px;height:678px;border-radius:42px;overflow:hidden;background:#ECEFF3">
      <div class="a" style="width:330px;height:92px;background:#fff;border-bottom:1px solid #DDE2E8">
        <div class="a" style="left:22px;top:34px;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#FDE3B5,#F6C9B6)"></div>
        <div class="a" style="left:76px;top:36px;font-size:20px;font-weight:700;color:#1F2329" data-k="chat"></div>
        <div class="a" style="left:76px;top:62px;font-size:15px;font-weight:500;color:#7A828E" data-k="members"></div>
      </div>
      <div class="a" style="left:14px;top:120px;width:302px;height:320px;border-radius:20px 6px 20px 20px;background:#DCF1E6">
        <div class="a" style="left:12px;top:12px;width:278px;height:200px;border-radius:14px;background:#fff;overflow:hidden">
          <svg class="a" width="278" height="200" viewBox="0 0 278 200">
            <rect width="278" height="200" style="fill:var(--tint-2)"/>
            <g transform="translate(46 44)">
              <circle cx="18" cy="18" r="17" style="fill:var(--brand)"/><path d="M10.5 18.4l5.2 5.2 10.2-10.6" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="50" y="11" width="136" height="14" rx="7" style="fill:var(--brand-light)"/>
              <circle cx="18" cy="62" r="17" style="fill:var(--brand)"/><path d="M10.5 62.4l5.2 5.2 10.2-10.6" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="50" y="55" width="100" height="14" rx="7" style="fill:var(--brand-light)"/>
              <circle cx="18" cy="106" r="15.5" fill="#fff" style="stroke:var(--brand-light)" stroke-width="3"/>
              <rect x="50" y="99" width="120" height="14" rx="7" style="fill:var(--track)"/>
            </g>
            <path d="M232 26 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" style="fill:var(--accent)"/>
          </svg>
        </div>
        <div class="a" style="left:12px;top:230px;width:278px;height:70px;border-radius:16px;background:#fff;box-shadow:0 0 0 7px color-mix(in srgb, var(--brand) 18%, transparent),0 16px 34px color-mix(in srgb, var(--brand) 35%, transparent);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--brand);font-weight:800;font-size:21px;letter-spacing:.03em">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" style="stroke:var(--brand)" stroke-width="2.4" stroke-linecap="round"><path d="M10 7.5H7.5a4.5 4.5 0 0 0 0 9H10M14 7.5h2.5a4.5 4.5 0 0 1 0 9H14M8.5 12h7"/></svg>
          <span data-k="domain"></span>
        </div>
      </div>
      <div class="a" style="left:206px;top:318px;width:66px;height:66px;border-radius:50%;background:color-mix(in srgb, var(--ink) 22%, transparent);border:3px solid rgba(255,255,255,.95);box-shadow:0 8px 18px color-mix(in srgb, var(--shadow) 28%, transparent)"></div>
    </div>
  </div>

  <div class="a" style="left:640px;top:548px;height:70px;padding:0 28px 0 20px;border-radius:35px;background:#fff;color:var(--success-ink);display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;box-shadow:0 18px 40px color-mix(in srgb, var(--shadow) 35%, transparent);transform:rotate(-3deg)">
    <span style="width:36px;height:36px;border-radius:50%;background:var(--success-bg);display:flex;align-items:center;justify-content:center"><span style="width:14px;height:14px;border-radius:50%;background:var(--success)"></span></span>
    <span data-k="result"></span>
  </div>
</div>
<script src="moteur.js"></script>
<script>
const TXT = {
  fr: { l1: 'Invitez', l2: 'l’équipe', promise: 'en un seul lien', chat: 'Équipe Produit', members: '3 membres', domain: 'COCHE.EXAMPLE', result: '+1 membre' },
  en: { l1: 'Invite', l2: 'the team', promise: 'with a single link', chat: 'Product Team', members: '3 members', domain: 'COCHE.EXAMPLE', result: '+1 member' }
};
const LANG = new URLSearchParams(location.search).get('lang') || 'fr';
document.documentElement.lang = LANG;
document.querySelectorAll('[data-k]').forEach(e => { e.textContent = (TXT[LANG] || TXT.fr)[e.dataset.k]; });
logos();
window.READY = (async () => {
  await Promise.all(policesCharte().map(f => document.fonts.load(f)));
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  return true;
})();
</script>
</body>
</html>
